name: Virta Health
description: >-
  Virta Health is a virtual, nutrition-first healthcare company delivering
  sustainable weight loss and type 2 diabetes reversal. Its program combines
  personalized nutrition plans, continuous expert health coaching, physician-led
  medication management, and connected devices, delivered through a consumer
  mobile app and sold to employers, health plans, and healthcare providers. Virta
  is HITRUST- and SOC 2 Type II-certified and operates as a HIPAA-covered clinical
  service. As of this enrichment pass Virta publishes no public developer API,
  developer portal, or machine-readable specification surface; this profile
  captures its public identity, security posture, and compliance certifications.
